<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班代大會線上投票系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase 8.x SDK CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Chart.js 圖表庫 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans max-w-2xl mx-auto pb-24">

  <!-- 1. 班代登入區 -->
  <div id="login-box" class="bg-white p-6 rounded-xl shadow-md mb-6">
    <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">班代大會線上投票系統</h1>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">選擇班級 / 身份</label>
        <select id="class-select" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500">
          <option value="">-- 請選擇班級或身份 --</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">姓名</label>
        <input type="text" id="user-name" placeholder="請輸入姓名" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>
      <button onclick="enterSystem()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700">進入投票大廳</button>
    </div>
  </div>

  <!-- 2. 班代投票大廳區 -->
  <div id="vote-box" class="hidden space-y-4">
    <!-- 使用者資訊頭部 -->
    <div class="bg-white p-4 rounded-xl shadow-md flex justify-between items-center border-b">
      <div>
        <span id="user-info" class="font-bold text-gray-800 text-lg"></span>
      </div>
      <button onclick="logoutUser()" class="text-xs text-red-500 hover:text-red-700 underline font-medium">登出身份</button>
    </div>

    <!-- 提案列表容器 -->
    <div id="proposals-container" class="space-y-4">
      <div class="bg-white p-8 rounded-xl shadow text-center text-gray-500">
        正在載入提案列表中...
      </div>
    </div>
  </div>

  <!-- 懸浮式送出投票按鈕列 -->
  <div id="floating-submit-bar" class="hidden fixed bottom-4 left-1/2 transform -translate-x-1/2 w-11/12 max-w-xl bg-white/95 backdrop-blur-md border border-blue-200 p-3.5 rounded-2xl shadow-2xl flex items-center justify-between z-50">
    <div class="text-xs font-semibold text-gray-700">勾選選項後，點擊右側按鈕送出</div>
    <button id="floating-submit-btn" onclick="submitAllVotes()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2.5 px-6 rounded-xl shadow-md transition transform active:scale-95 disabled:bg-gray-400">
      送出投票
    </button>
  </div>

  <!-- 3. 管理員開票後台 -->
  <div class="mt-8 pt-4 border-t text-xs text-gray-500">
    <button onclick="toggleAdmin()" class="underline text-blue-600 font-medium">切換管理員後台</button>
    
    <div id="admin-panel" class="hidden mt-3 p-5 bg-gray-900 text-white rounded-xl shadow-xl space-y-5">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h3 class="font-bold text-base text-yellow-400">管理員即時控制台</h3>
        <button onclick="logoutAdmin()" class="text-xs text-gray-400 hover:text-white underline">登出後台</button>
      </div>

      <!-- 發布新提案模組 -->
      <div class="bg-gray-800 p-3.5 rounded-lg border border-gray-700 space-y-2">
        <label class="block text-xs text-gray-300 font-bold">1. 發布新提案（最新提案將優先顯示於大廳最上方）</label>
        <input type="text" id="new-proposal-input" placeholder="請輸入新提案名稱..." class="w-full text-black p-2 rounded text-sm">
        <button onclick="publishNewProposal()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 py-2 rounded font-bold transition">新增提案並開放投票</button>
      </div>

      <!-- 選擇與切換提案 -->
      <div class="bg-gray-800 p-3.5 rounded-lg border border-gray-700 space-y-2">
        <label class="block text-xs text-gray-300 font-bold">2. 檢視/切換後台監控提案</label>
        <select id="proposal-history-select" onchange="switchAdminViewProposal(this.value)" class="w-full text-black p-2 rounded text-sm">
          <option value="">-- 尚未發布任何提案 --</option>
        </select>
      </div>

      <!-- 狀態開關與數據統計 -->
      <div class="bg-gray-800 p-3.5 rounded-lg border border-gray-700 space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-xs text-gray-300 font-bold">3. 選定提案控制與即時結果</label>
          <button onclick="toggleVotingStatus()" id="admin-toggle-btn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-xs font-bold">關閉投票</button>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center pt-1">
          <div class="bg-gray-700 p-2 rounded">
            <div class="text-gray-400 text-xs">總投票數</div>
            <div id="stat-total" class="text-xl font-bold text-white">0</div>
          </div>
          <div class="bg-green-900/50 border border-green-700 p-2 rounded">
            <div class="text-green-400 text-xs">同意</div>
            <div id="stat-agree" class="text-xl font-bold text-green-400">0</div>
          </div>
          <div class="bg-red-900/50 border border-red-700 p-2 rounded">
            <div class="text-red-400 text-xs">不同意</div>
            <div id="stat-disagree" class="text-xl font-bold text-red-400">0</div>
          </div>
        </div>

        <!-- 視覺化圖表容器 -->
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 flex justify-center items-center" style="position: relative; height: 180px;">
          <canvas id="voteChart"></canvas>
        </div>

        <div>
          <div class="text-xs text-gray-400 mb-1">已投票明細：</div>
          <div id="voted-list" class="bg-gray-900 p-2 rounded text-xs text-gray-300 max-h-28 overflow-y-auto space-x-1">
            (尚無投票紀錄)
          </div>
        </div>
      </div>

      <!-- 危險操作：刪除所有提案資料 -->
      <div class="bg-red-950/60 p-3.5 rounded-lg border border-red-800 space-y-2">
        <label class="block text-xs text-red-300 font-bold">4. 危險操作區</label>
        <button onclick="deleteAllProposalsData()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded font-bold transition">
          🗑️ 刪除所有提案與投票資料
        </button>
      </div>

    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Firebase 初始化
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "online-vote-system-59be9.firebaseapp.com",
      databaseURL: "https://online-vote-system-59be9-default-rtdb.firebaseio.com/",
      projectId: "online-vote-system-59be9",
      storageBucket: "online-vote-system-59be9.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 初始化下拉選單選項
    const select = document.getElementById('class-select');
    
    ['學生會', '老師'].forEach(specialOpt => {
      const opt = document.createElement('option');
      opt.value = specialOpt;
      opt.textContent = `★ ${specialOpt}`;
      select.appendChild(opt);
    });

    [1, 2, 3].forEach(grade => {
      for (let i = 1; i <= 23; i++) {
        const classNum = `${grade}${i.toString().padStart(2, '0')}`;
        const opt = document.createElement('option');
        opt.value = `${classNum}班`;
        opt.textContent = `${classNum}班`;
        select.appendChild(opt);
      }
    });

    let currentUser = null;
    let isAdmin = false;
    let proposalsData = {};
    let votesData = {};

    let adminSelectedProposalId = null;
    let adminProposalListener = null;
    let adminVotesListener = null;
    let voteChart = null;

    function isSpecialUser(cls) {
      return cls === '學生會' || cls === '老師';
    }

    // 1. 登入進入系統
    function enterSystem() {
      const cls = select.value;
      const name = document.getElementById('user-name').value.trim();
      if (!cls || !name) return alert('請選擇班級/身份並填寫姓名！');

      if (isSpecialUser(cls)) {
        proceedLogin(cls, name);
        return;
      }

      const onlineRef = db.ref(`onlineUsers/${cls}`);
      onlineRef.once('value').then((snap) => {
        if (snap.exists()) {
          const activeUser = snap.val();
          const now = Date.now();
          if (activeUser.lastActive && (now - activeUser.lastActive < 120000)) {
            alert(`【重複登入限制】\n「${cls}」目前已有代表 (${activeUser.name}) 在線上！\n一班同時僅限一人登入投票。`);
            return;
          }
        }

        onlineRef.set({
          name: name,
          loginAt: Date.now(),
          lastActive: Date.now()
        });
        onlineRef.onDisconnect().remove();

        setInterval(() => {
          if (currentUser && currentUser.cls === cls) {
            db.ref(`onlineUsers/${cls}/lastActive`).set(Date.now());
          }
        }, 30000);

        proceedLogin(cls, name);
      });
    }

    function proceedLogin(cls, name) {
      currentUser = { cls, name };
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('vote-box').classList.remove('hidden');
      document.getElementById('floating-submit-bar').classList.remove('hidden');
      document.getElementById('user-info').innerText = `${cls} - ${name}`;

      startListeningProposalsAndVotes();
    }

    function logoutUser() {
      if (currentUser && !isSpecialUser(currentUser.cls)) {
        db.ref(`onlineUsers/${currentUser.cls}`).remove();
      }
      currentUser = null;
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('vote-box').classList.add('hidden');
      document.getElementById('floating-submit-bar').classList.add('hidden');
    }

    // 2. 監聽提案與投票紀錄
    function startListeningProposalsAndVotes() {
      db.ref('proposals').on('value', (pSnap) => {
        proposalsData = pSnap.val() || {};
        renderProposalsLobby();
      });

      db.ref('votes').on('value', (vSnap) => {
        votesData = vSnap.val() || {};
        renderProposalsLobby();
      });
    }

    // 檢查某提案當前使用者是否已投票 (結合 LocalStorage 與 Firebase 紀錄)
    function getUserVoteRecord(propId) {
      if (!currentUser) return null;
      
      // 1. 先查本地 LocalStorage
      const localKey = `voted_${currentUser.cls}_${propId}`;
      const localVote = localStorage.getItem(localKey);
      if (localVote) return localVote;

      // 2. 再查 Firebase Realtime DB 快取
      const propVotes = votesData[propId] || {};
      if (!isSpecialUser(currentUser.cls) && propVotes[currentUser.cls]) {
        return propVotes[currentUser.cls].choice;
      }

      return null;
    }

    // 渲染投票大廳提案列表
    function renderProposalsLobby() {
      const container = document.getElementById('proposals-container');
      if (!currentUser) return;

      const pKeys = Object.keys(proposalsData);
      if (pKeys.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-xl shadow text-center text-gray-500">
            目前尚無任何發布的提案，請等待管理員建立提案。
          </div>`;
        return;
      }

      pKeys.sort((a, b) => (proposalsData[b].createdAt || 0) - (proposalsData[a].createdAt || 0));

      let htmlStr = '';

      pKeys.forEach((propId) => {
        const prop = proposalsData[propId];
        const userVote = getUserVoteRecord(propId);
        const isOpen = prop.isOpen;

        htmlStr += `
          <div class="bg-white p-5 rounded-xl shadow-md border border-gray-100 space-y-3" id="prop-card-${propId}">
            <div class="flex justify-between items-start border-b pb-2">
              <h3 class="text-lg font-bold text-gray-800 flex-1 pr-2">${prop.title}</h3>
              ${isOpen 
                ? `<span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-bold whitespace-nowrap">投票進行中</span>`
                : `<span class="bg-red-100 text-red-800 text-xs px-2.5 py-1 rounded-full font-bold whitespace-nowrap">投票已結束</span>`
              }
            </div>
        `;

        if (!isOpen) {
          htmlStr += `
            <div class="p-3 bg-gray-50 text-gray-600 text-sm rounded-lg border">
              🔒 此提案投票已結束。
              ${userVote ? `<span class="block mt-1 font-semibold text-blue-600">您的投票紀錄：${userVote === 'agree' ? '同意' : '不同意'}</span>` : ''}
            </div>
          `;
        } else if (userVote) {
          // 【已投票狀態】完全隱藏 Radio 投票格，銷毀選擇權，直接鎖死顯示結果
          htmlStr += `
            <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg shadow-inner space-y-2">
              <div class="flex items-center justify-between">
                <span class="flex items-center gap-1.5 text-gray-700 font-bold text-sm">
                  <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  🔒 投票已鎖定（已完成送出）
                </span>
                <span class="text-xs ${userVote === 'agree' ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'} px-3 py-1 rounded-full font-extrabold">
                  您的選擇：${userVote === 'agree' ? '同意' : '不同意'}
                </span>
              </div>
              <p class="text-xs text-gray-400">系統已正式登記您（${currentUser.cls} - ${currentUser.name}）的表決結果，無法再次修改或重新投票。</p>
            </div>
          `;
        } else {
          // 【未投票狀態】開放投票格
          htmlStr += `
            <div class="space-y-2 pt-1" id="vote-options-${propId}">
              <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-blue-50/50 transition">
                  <span class="font-semibold text-green-600">同意 (Agree)</span>
                  <input type="radio" name="vote_choice_${propId}" value="agree" class="w-5 h-5 text-blue-600">
                </label>
                <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-blue-50/50 transition">
                  <span class="font-semibold text-red-600">不同意 (Against)</span>
                  <input type="radio" name="vote_choice_${propId}" value="disagree" class="w-5 h-5 text-blue-600">
                </label>
              </div>
            </div>
          `;
        }

        htmlStr += `</div>`;
      });

      container.innerHTML = htmlStr;
    }

    // 3. 送出投票
    async function submitAllVotes() {
      if (!currentUser) return alert('請先登入！');

      const checkedInputs = document.querySelectorAll('input[type="radio"][name^="vote_choice_"]:checked');
      if (checkedInputs.length === 0) {
        return alert('請先勾選至少一個提案的投票選項（同意/不同意）！');
      }

      const submitBtn = document.getElementById('floating-submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = '鎖定中...';

      let successCount = 0;

      for (const input of checkedInputs) {
        const propId = input.name.replace('vote_choice_', '');
        const choice = input.value;

        // 一、第一時間：立刻於本地儲存鎖定標記 (LocalStorage)
        const localKey = `voted_${currentUser.cls}_${propId}`;
        localStorage.setItem(localKey, choice);

        // 二、第一時間：立即將前端 DOM 上該提案的投票格銷毀替換，防止二次點擊
        const optContainer = document.getElementById(`vote-options-${propId}`);
        if (optContainer) {
          optContainer.innerHTML = `
            <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg shadow-inner flex items-center justify-between">
              <span class="flex items-center gap-1.5 text-gray-700 font-bold text-sm">
                🔒 投票已鎖定
              </span>
              <span class="text-xs ${choice === 'agree' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'} px-3 py-1 rounded-full font-bold">
                您的選擇：${choice === 'agree' ? '同意' : '不同意'}
              </span>
            </div>
          `;
        }

        // 三、後續異步同步至 Firebase 資料庫
        try {
          if (!isSpecialUser(currentUser.cls)) {
            await db.ref(`votes/${propId}/${currentUser.cls}`).set({
              cls: currentUser.cls,
              name: currentUser.name,
              choice: choice,
              timestamp: Date.now()
            });
          } else {
            await db.ref(`votes/${propId}`).push({
              cls: currentUser.cls,
              name: currentUser.name,
              choice: choice,
              timestamp: Date.now()
            });
          }
          successCount++;
        } catch (err) {
          console.error("Firebase Sync Error:", err);
        }
      }

      // 重新繪製大廳確定選單已徹底鎖死
      renderProposalsLobby();

      submitBtn.disabled = false;
      submitBtn.innerText = '送出投票';

      alert(`投票已正式送出並鎖定！`);
    }

    // -------------------------------------------------------------
    // 管理員後台邏輯
    // -------------------------------------------------------------

    function toggleAdmin() {
      const panel = document.getElementById('admin-panel');
      if (panel.classList.contains('hidden')) {
        if (!isAdmin) {
          const pwd = prompt('請輸入管理員密碼：');
          if (pwd === '4510') {
            isAdmin = true;
            panel.classList.remove('hidden');
            initChart();
            loadAdminProposalsHistory();
          } else if (pwd !== null) {
            alert('密碼錯誤！');
          }
        } else {
          panel.classList.remove('hidden');
        }
      } else {
        panel.classList.add('hidden');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById('admin-panel').classList.add('hidden');
    }

    function publishNewProposal() {
      const input = document.getElementById('new-proposal-input');
      const title = input.value.trim();
      if (!title) return alert('請輸入提案名稱！');

      if (!confirm('確定要發布新提案嗎？發布後將出現在全體班代投票大廳最上方。')) return;

      const newPropRef = db.ref('proposals').push();
      const newPropId = newPropRef.key;

      newPropRef.set({
        title: title,
        isOpen: true,
        createdAt: Date.now()
      }, (err) => {
        if (!err) {
          db.ref('activeProposalId').set(newPropId);
          alert('新提案已成功發布並開放投票！');
          input.value = '';
        }
      });
    }

    function loadAdminProposalsHistory() {
      db.ref('proposals').on('value', (snapshot) => {
        const proposals = snapshot.val() || {};
        const selectEl = document.getElementById('proposal-history-select');
        selectEl.innerHTML = '';

        const keys = Object.keys(proposals).reverse();

        if (keys.length === 0) {
          selectEl.innerHTML = '<option value="">-- 尚未發布任何提案 --</option>';
          return;
        }

        keys.forEach(id => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = `${proposals[id].title} (${proposals[id].isOpen ? '投票中' : '已關閉'})`;
          selectEl.appendChild(opt);
        });

        if (!adminSelectedProposalId || !proposals[adminSelectedProposalId]) {
          switchAdminViewProposal(keys[0]);
        }
      });
    }

    function switchAdminViewProposal(propId) {
      if (!propId) return;
      adminSelectedProposalId = propId;
      document.getElementById('proposal-history-select').value = propId;

      if (adminProposalListener) adminProposalListener.off();
      if (adminVotesListener) adminVotesListener.off();

      adminProposalListener = db.ref(`proposals/${propId}`);
      adminProposalListener.on('value', (snap) => {
        const p = snap.val();
        const btn = document.getElementById('admin-toggle-btn');
        if (!p) return;

        if (p.isOpen) {
          btn.innerText = "關閉本提案投票";
          btn.className = "bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-xs font-bold";
        } else {
          btn.innerText = "重新開啟本提案投票";
          btn.className = "bg-green-500 hover:bg-green-600 px-3 py-1 rounded text-xs font-bold";
        }
      });

      adminVotesListener = db.ref(`votes/${propId}`);
      adminVotesListener.on('value', (snapshot) => {
        const votes = snapshot.val() || {};
        let agreeCount = 0;
        let disagreeCount = 0;
        let votedClasses = [];

        Object.keys(votes).forEach((key) => {
          const v = votes[key];
          const displayCls = v.cls || key;
          votedClasses.push(`${displayCls}(${v.name})`);
          if (v.choice === 'agree') agreeCount++;
          if (v.choice === 'disagree') disagreeCount++;
        });

        const totalVotes = agreeCount + disagreeCount;

        document.getElementById('stat-total').innerText = totalVotes;
        document.getElementById('stat-agree').innerText = agreeCount;
        document.getElementById('stat-disagree').innerText = disagreeCount;
        
        if (voteChart) {
          voteChart.data.datasets[0].data = [agreeCount, disagreeCount];
          voteChart.update();
        }

        const listEl = document.getElementById('voted-list');
        listEl.innerHTML = votedClasses.length > 0 
          ? votedClasses.map(c => `<span class="inline-block bg-gray-800 px-2 py-0.5 rounded m-0.5 border border-gray-700">${c}</span>`).join('')
          : '(尚無投票紀錄)';
      });
    }

    function toggleVotingStatus() {
      if (!adminSelectedProposalId) return alert('請先選擇提案');
      db.ref(`proposals/${adminSelectedProposalId}/isOpen`).once('value', (snap) => {
        const currentOpen = snap.val();
        db.ref(`proposals/${adminSelectedProposalId}/isOpen`).set(!currentOpen);
      });
    }

    function deleteAllProposalsData() {
      const confirm1 = confirm("【警告：高風險操作】\n此動作將會「永久刪除」資料庫中所有的提案記錄與投票結果！\n確定要繼續進行清空嗎？");
      if (!confirm1) return;

      const confirm2 = prompt("【第二重確認】\n請在下方輸入「刪除資料」四個字以執行刪除：");
      if (confirm2 === "刪除資料") {
        Promise.all([
          db.ref('proposals').remove(),
          db.ref('votes').remove(),
          db.ref('activeProposalId').remove()
        ]).then(() => {
          localStorage.clear();
          alert("所有提案與投票數據已成功清空！");
          adminSelectedProposalId = null;
          document.getElementById('proposal-history-select').innerHTML = '<option value="">-- 尚未發布任何提案 --</option>';
          document.getElementById('stat-total').innerText = '0';
          document.getElementById('stat-agree').innerText = '0';
          document.getElementById('stat-disagree').innerText = '0';
          if (voteChart) {
            voteChart.data.datasets[0].data = [0, 0];
            voteChart.update();
          }
          document.getElementById('voted-list').innerText = '(尚無投票紀錄)';
        }).catch((err) => {
          alert("刪除失敗：" + err.message);
        });
      } else {
        alert("輸入內容不符，已取消刪除操作。");
      }
    }

    function initChart() {
      if (voteChart) return;
      const ctx = document.getElementById('voteChart').getContext('2d');
      voteChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['同意', '不同意'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['#22c55e', '#ef4444'],
            borderWidth: 2,
            borderColor: '#111827'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#d1d5db', font: { size: 12 } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
